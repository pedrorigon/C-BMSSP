name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    tags: ["v*"]

# Deny-all at workflow level; jobs that need more grant it explicitly.
# actions: write is required by the runner to honour cancel-in-progress.
permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARTIFACT_RETENTION_DAYS: "7"

jobs:
  # -----------------------------------------------------------------------
  # Gate: compile in Release mode.  The three test jobs won't start until
  # this passes, ensuring we don't burn CI minutes on a broken build.
  # On tag pushes the CLI binaries are also packaged and uploaded here so
  # the release job can reuse the exact same artifact that was tested.
  # -----------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release -j$(nproc)

      - name: Compute SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: build/release/test
        run: |
          set -euo pipefail
          sha256sum sssp_compare sssp_benchmark sssp_batch_results sssp_scaling > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: bmssp-linux-x64
          path: |
            build/release/test/sssp_compare
            build/release/test/sssp_benchmark
            build/release/test/sssp_batch_results
            build/release/test/sssp_scaling
            build/release/test/SHA256SUMS
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # -----------------------------------------------------------------------
  # Run the full CTest suite in Release mode.
  # -----------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release -j$(nproc)

      - name: Test
        run: ctest --preset release --output-on-failure

  # -----------------------------------------------------------------------
  # Full test suite compiled with AddressSanitizer + UndefinedBehaviorSanitizer.
  # OMP_NUM_THREADS=2 is injected by the ctest preset in CMakePresets.json.
  # -----------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Configure
        run: cmake --preset sanitizers

      - name: Build
        run: cmake --build --preset sanitizers -j$(nproc)

      - name: Test
        run: ctest --preset sanitizers --output-on-failure

  # -----------------------------------------------------------------------
  # Build with gcov instrumentation, run tests, then generate an HTML +
  # Cobertura XML report via gcovr (filtered to src/).
  # Results are posted to the GitHub Actions job summary so they appear
  # inline in the PR and push views without leaving GitHub.
  # -----------------------------------------------------------------------
  coverage:
    name: Coverage (gcovr)
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ gcovr

      - name: Configure
        run: cmake --preset tests

      - name: Build
        run: cmake --build --preset tests -j$(nproc)

      - name: Test
        run: ctest --preset tests --output-on-failure

      - name: Generate coverage report
        run: |
          set -euo pipefail
          mkdir -p coverage
          gcovr \
            --root . \
            --filter 'src/' \
            --exclude-unreachable-branches \
            --exclude-throw-branches \
            --html-details coverage/index.html \
            --xml coverage/coverage.xml \
            --json-summary coverage/summary.json \
            --print-summary \
            build/tests

      - name: Post coverage summary to job
        run: |
          python3 - <<'PYEOF'
          import json, os

          with open("coverage/summary.json") as f:
              data = json.load(f)

          def pct(val):
              return float(val) if val is not None else 0.0

          def badge(p):
              if p >= 90: return "🟢"
              if p >= 75: return "🟡"
              return "🔴"

          lp = pct(data.get("line_percent"))
          bp = pct(data.get("branch_percent"))
          fp = pct(data.get("function_percent"))

          md = f"""\
          ## Code Coverage

          | Metric | Covered / Total | Percentage | |
          |--------|-----------------|:----------:|-|
          | Lines | {data.get('line_covered', 0)} / {data.get('line_total', 0)} | **{lp:.1f}%** | {badge(lp)} |
          | Branches | {data.get('branch_covered', 0)} / {data.get('branch_total', 0)} | **{bp:.1f}%** | {badge(bp)} |
          | Functions | {data.get('function_covered', 0)} / {data.get('function_total', 0)} | **{fp:.1f}%** | {badge(fp)} |

          > 🟢 ≥ 90% &nbsp;&nbsp; 🟡 ≥ 75% &nbsp;&nbsp; 🔴 < 75%

          <details><summary>Per-file breakdown</summary>

          | File | Lines | Branches | Functions |
          |------|------:|---------:|----------:|
          """

          for entry in sorted(data.get("files", []), key=lambda x: x.get("filename", "")):
              name = entry.get("filename", "")
              flp = pct(entry.get("line_percent"))
              fbp = pct(entry.get("branch_percent"))
              ffp = pct(entry.get("function_percent"))
              md += f"| `{name}` | {flp:.1f}% | {fbp:.1f}% | {ffp:.1f}% |\n"

          md += "\n</details>\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(md)
          PYEOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # -----------------------------------------------------------------------
  # Creates a GitHub Release from the binaries produced by the build job.
  # Only runs on tag pushes, and only after all three test jobs pass.
  # -----------------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sanitizers, coverage]
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: bmssp-linux-x64
          path: artifacts/

      - name: Make binaries executable
        run: |
          chmod +x \
            artifacts/sssp_compare \
            artifacts/sssp_benchmark \
            artifacts/sssp_batch_results \
            artifacts/sssp_scaling

      - name: Verify SHA-256 checksums
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS

      - name: Rename binaries with platform suffix
        run: |
          set -euo pipefail
          cd artifacts
          mv sssp_compare       sssp_compare-linux-x64
          mv sssp_benchmark     sssp_benchmark-linux-x64
          mv sssp_batch_results sssp_batch_results-linux-x64
          mv sssp_scaling       sssp_scaling-linux-x64
          sha256sum \
            sssp_compare-linux-x64 \
            sssp_benchmark-linux-x64 \
            sssp_batch_results-linux-x64 \
            sssp_scaling-linux-x64 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/sssp_compare-linux-x64 \
            artifacts/sssp_benchmark-linux-x64 \
            artifacts/sssp_batch_results-linux-x64 \
            artifacts/sssp_scaling-linux-x64 \
            artifacts/SHA256SUMS
